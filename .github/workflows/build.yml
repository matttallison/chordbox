name: Build PhotoTape

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CIA tools (bannertool, makerom)
        run: |
          apt-get update && apt-get install -y p7zip-full curl
          curl -L https://github.com/Epicpkmn11/bannertool/releases/latest/download/bannertool.zip -o bannertool.zip
          7z e -y bannertool.zip linux-x86_64/bannertool
          chmod +x bannertool && mv bannertool /usr/local/bin/
          curl -L https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.17/makerom-v0.17-ubuntu_x86_64.zip -o makerom.zip
          7z e -y makerom.zip
          chmod +x makerom && mv makerom /usr/local/bin/

      - name: Build .3dsx and .cia
        id: build
        shell: bash
        run: |
          set -o pipefail
          {
            make &&
            bannertool makebanner -i app/banner.png -a app/BannerAudio.wav -o build/banner.bin &&
            bannertool makesmdh -s "PhotoTape" -l "Every photo is a synth patch" -p "Soul Provider Records" -i app/icon.png -o build/icon.bin &&
            makerom -f cia -target t -o phototape.cia -elf phototape.elf -rsf app/phototape.rsf -banner build/banner.bin -icon build/icon.bin
          } 2>&1 | tee build.log

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phototape
          path: |
            phototape.3dsx
            phototape.cia
            build.log

      - name: Publish to "phototape" release (QR / phone download)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phototape
          name: PhotoTape (latest build)
          make_latest: false
          files: |
            phototape.3dsx
            phototape.cia
            build.log
