name: Build ChordBox

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .3dsx
        run: make

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chordbox
          path: chordbox.3dsx

      - name: Publish to "latest" release (direct phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ChordBox (latest build)
          prerelease: false
          make_latest: true
          files: chordbox.3dsx
